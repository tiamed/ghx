name: release

# On a v* tag, rebuild the same binaries as `make build-all`, keep them as
# workflow artifacts, and attach them to the GitHub Release for that tag.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -race ./...

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: make build-all VERSION="${GITHUB_REF_NAME}"
      - name: Checksums
        working-directory: dist
        run: sha256sum ghx-linux-amd64 ghx-linux-arm64 ghx-windows-amd64.exe > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ghx-${{ github.ref_name }}
          path: |
            dist/ghx-linux-amd64
            dist/ghx-linux-arm64
            dist/ghx-windows-amd64.exe
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 90
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          files=(
            dist/ghx-linux-amd64
            dist/ghx-linux-arm64
            dist/ghx-windows-amd64.exe
            dist/SHA256SUMS
          )
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"
          else
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$tag" \
              --generate-notes \
              "${files[@]}"
          fi
